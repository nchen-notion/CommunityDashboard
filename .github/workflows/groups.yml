name: Group Member Counts

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month, 00:00 UTC
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (blank = all). Options: Facebook, Reddit, Discord, Telegram, Meetup, Connpass, Peatix, Clubhouse, Twitter, Instagram"
        required: false
        default: ""
      workers:
        description: "Concurrent workers"
        required: true
        default: "4"
      skip_if_filled:
        description: "Skip rows whose Followers field is already populated (true/false)"
        required: false
        default: "false"
      limit:
        description: "Process only the first N rows (blank for all)"
        required: false
        default: ""

jobs:
  fetch-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run groups scraper
        working-directory: groups
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_GROUPS_DATABASE_ID: ${{ secrets.NOTION_GROUPS_DATABASE_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          ARGS="--workers ${{ github.event.inputs.workers }}"
          if [ -n "${{ github.event.inputs.platforms }}" ]; then
            ARGS="$ARGS --platforms ${{ github.event.inputs.platforms }}"
          fi
          if [ "${{ github.event.inputs.skip_if_filled }}" = "true" ]; then
            ARGS="$ARGS --skip-if-filled"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python main.py $ARGS
