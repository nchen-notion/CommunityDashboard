name: Follower Counts

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (youtube, instagram, tiktok, twitter, notion_templates)"
        required: true
        default: "youtube,notion_templates"
      workers:
        description: "Concurrent workers"
        required: true
        default: "4"
      skip_if_filled:
        description: "Skip a platform on rows where its count is already populated (true/false)"
        required: false
        default: "false"
      limit:
        description: "Process only the first N rows (blank for all)"
        required: false
        default: ""

jobs:
  fetch-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: enricher
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          ARGS="--platforms ${{ github.event.inputs.platforms }} --workers ${{ github.event.inputs.workers }}"
          if [ "${{ github.event.inputs.skip_if_filled }}" = "true" ]; then
            ARGS="$ARGS --skip-if-filled"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python main.py $ARGS
